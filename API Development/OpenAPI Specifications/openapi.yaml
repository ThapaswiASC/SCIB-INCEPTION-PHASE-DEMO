openapi: 3.0.3
info:
  title: Task Management API
  description: |
    Enterprise Task Management API System providing comprehensive task creation, management, and tracking capabilities.
    
    This API follows RESTful principles and implements enterprise-grade security, compliance, and performance standards.
    
    ## Key Features
    - Comprehensive task lifecycle management
    - Enterprise authentication and authorization
    - Real-time validation and error handling
    - Audit logging and compliance tracking
    - High-performance and scalable architecture
    
    ## Security
    - OAuth 2.0 / OpenID Connect authentication
    - Role-Based Access Control (RBAC)
    - Rate limiting and DDoS protection
    - Comprehensive input validation and sanitization
    
    ## Compliance
    - GDPR, PCI-DSS, ISO 27001 compliant
    - Comprehensive audit trails
    - Data encryption at rest and in transit
    
    For more information, visit our [developer portal](https://developer.enterprise.com)
  version: 1.0.0
  contact:
    name: API Architecture Team
    email: api-support@enterprise.com
    url: https://developer.enterprise.com/support
  license:
    name: Enterprise License
    url: https://enterprise.com/license
  termsOfService: https://enterprise.com/terms

servers:
  - url: https://api.enterprise.com/v1
    description: Production server
  - url: https://api-staging.enterprise.com/v1
    description: Staging server
  - url: https://api-dev.enterprise.com/v1
    description: Development server

paths:
  /api/tasks:
    post:
      tags:
        - Tasks
      summary: Create a new task
      description: |
        Creates a new task in the system with comprehensive validation and business logic processing.
        
        This endpoint implements the core task creation functionality as specified in DEMO-2350,
        including input validation, business rule enforcement, and audit logging.
        
        ## Business Rules
        - Task title is required and must be unique per user
        - Due date cannot be in the past
        - Assigned user must be active and have appropriate permissions
        - Task status must be valid according to workflow rules
      operationId: createTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            examples:
              basic_task:
                summary: Basic task creation
                value:
                  title: "Complete project documentation"
                  description: "Create comprehensive documentation for the new API endpoints"
                  status: "TODO"
                  priority: "HIGH"
                  dueDate: "2024-12-31T23:59:59.000Z"
                  assignedTo: "123e4567-e89b-12d3-a456-426614174000"
                  tags: ["documentation", "api", "urgent"]
              minimal_task:
                summary: Minimal required fields
                value:
                  title: "Review code changes"
                  status: "TODO"
                  dueDate: "2024-06-30T17:00:00.000Z"
      responses:
        '201':
          description: Task created successfully
          headers:
            Location:
              description: URL of the created task
              schema:
                type: string
                format: uri
                example: "/api/tasks/123e4567-e89b-12d3-a456-426614174000"
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                created_task:
                  summary: Successfully created task
                  value:
                    id: "123e4567-e89b-12d3-a456-426614174000"
                    title: "Complete project documentation"
                    description: "Create comprehensive documentation for the new API endpoints"
                    status: "TODO"
                    priority: "HIGH"
                    dueDate: "2024-12-31T23:59:59.000Z"
                    assignedTo:
                      id: "123e4567-e89b-12d3-a456-426614174001"
                      name: "John Doe"
                      email: "john.doe@enterprise.com"
                    createdBy:
                      id: "123e4567-e89b-12d3-a456-426614174002"
                      name: "Jane Smith"
                      email: "jane.smith@enterprise.com"
                    tags: ["documentation", "api", "urgent"]
                    metadata:
                      project: "API-2024"
                      department: "Engineering"
                    createdAt: "2024-01-01T10:00:00.000Z"
                    updatedAt: "2024-01-01T10:00:00.000Z"
                    version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    get:
      tags:
        - Tasks
      summary: List tasks
      description: |
        Retrieves a paginated list of tasks with filtering and sorting options.
        
        Supports comprehensive filtering, sorting, and search capabilities for efficient task management.
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersion'
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: status
          in: query
          description: Filter by task status
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          description: Filter by task priority
          required: false
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - name: assignedTo
          in: query
          description: Filter by assigned user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: createdBy
          in: query
          description: Filter by creator user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: tags
          in: query
          description: Comma-separated list of tags to filter by
          required: false
          schema:
            type: string
            example: "documentation,api,urgent"
        - name: sort
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: ["createdAt", "updatedAt", "dueDate", "title", "priority", "status"]
            default: "createdAt"
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
        - name: search
          in: query
          description: Full-text search in title and description
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Tasks retrieved successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task by ID
      description: Retrieves a specific task by its unique identifier with complete details including history.
      operationId: getTaskById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Task retrieved successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Entity tag for optimistic locking
              schema:
                type: string
                example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - Tasks
      summary: Update task
      description: |
        Updates an existing task with new information. Supports partial updates and optimistic locking.
        
        Uses the If-Match header for version control to prevent concurrent modification conflicts.
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersion'
        - name: If-Match
          in: header
          description: Entity tag for optimistic locking
          required: true
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              description: Updated entity tag
              schema:
                type: string
                example: '"2"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags:
        - Tasks
      summary: Delete task
      description: |
        Soft deletes a task (marks as deleted but preserves data for audit purposes).
        
        The task will no longer appear in regular queries but remains in the system for compliance and audit requirements.
      operationId: deleteTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '204':
          description: Task deleted successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      tags:
        - System
      summary: Basic health check
      description: Returns basic system health status
      operationId: healthCheck
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-01T10:00:00.000Z"
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unhealthy"
                  timestamp:
                    type: string
                    format: date-time
                  details:
                    type: object

  /health/detailed:
    get:
      tags:
        - System
      summary: Detailed health check
      description: Returns detailed system health status including dependencies
      operationId: detailedHealthCheck
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detailed system health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  components:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          responseTime:
                            type: number
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          responseTime:
                            type: number
                      authService:
                        type: object
                        properties:
                          status:
                            type: string
                          responseTime:
                            type: number

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth 2.0 Bearer Token authentication.
        
        Include the token in the Authorization header: `Authorization: Bearer <token>`
        
        Tokens are obtained through the enterprise authentication service using OAuth 2.0 flows.
  
  parameters:
    TaskId:
      name: id
      in: path
      description: Task unique identifier
      required: true
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
    
    CorrelationId:
      name: X-Correlation-ID
      in: header
      description: Unique identifier for request tracing across services
      required: false
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
    
    ApiVersion:
      name: X-API-Version
      in: header
      description: API version (defaults to latest if not specified)
      required: false
      schema:
        type: string
        enum: ["v1"]
        default: "v1"
        example: "v1"
  
  headers:
    CorrelationId:
      description: Request correlation ID for tracing
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"
  
  schemas:
    CreateTaskRequest:
      type: object
      required:
        - title
        - status
        - dueDate
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title
          example: "Complete project documentation"
        description:
          type: string
          maxLength: 2000
          description: Detailed task description
          example: "Create comprehensive documentation for the new API endpoints"
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
          description: Task due date (ISO 8601 format)
          example: "2024-12-31T23:59:59.000Z"
        assignedTo:
          type: string
          format: uuid
          description: User ID of assigned person
          example: "123e4567-e89b-12d3-a456-426614174000"
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
          description: Task tags for categorization
          example: ["documentation", "api", "urgent"]
        metadata:
          type: object
          description: Additional task metadata
          additionalProperties: true
          example:
            project: "API-2024"
            department: "Engineering"
    
    UpdateTaskRequest:
      type: object
      description: Task update request (all fields optional for partial updates)
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 2000
          description: Detailed task description
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
          description: Task due date (ISO 8601 format)
        assignedTo:
          type: string
          format: uuid
          description: User ID of assigned person
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
          description: Task tags for categorization
        metadata:
          type: object
          description: Additional task metadata
          additionalProperties: true
    
    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Task title
          example: "Complete project documentation"
        description:
          type: string
          description: Task description
          example: "Create comprehensive documentation for the new API endpoints"
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: "2024-12-31T23:59:59.000Z"
        assignedTo:
          $ref: '#/components/schemas/UserSummary'
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        tags:
          type: array
          items:
            type: string
          description: Task tags
          example: ["documentation", "api", "urgent"]
        metadata:
          type: object
          description: Task metadata
          additionalProperties: true
          example:
            project: "API-2024"
            department: "Engineering"
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
          example: "2024-01-01T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Task last update timestamp
          example: "2024-01-01T10:00:00.000Z"
        version:
          type: integer
          description: Task version for optimistic locking
          example: 1
      required:
        - id
        - title
        - status
        - dueDate
        - createdBy
        - createdAt
        - updatedAt
        - version
    
    TaskDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TaskResponse'
        - type: object
          properties:
            history:
              type: array
              items:
                $ref: '#/components/schemas/TaskHistoryEntry'
              description: Task change history
    
    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
          description: Array of tasks
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        filters:
          type: object
          description: Applied filters
          additionalProperties: true
        sort:
          type: object
          properties:
            field:
              type: string
              description: Sort field
            order:
              type: string
              enum: ["asc", "desc"]
              description: Sort order
      required:
        - data
        - pagination
    
    TaskHistoryEntry:
      type: object
      properties:
        field:
          type: string
          description: Changed field name
          example: "status"
        oldValue:
          type: string
          description: Previous value
          example: "TODO"
        newValue:
          type: string
          description: New value
          example: "IN_PROGRESS"
        changedBy:
          $ref: '#/components/schemas/UserSummary'
        changedAt:
          type: string
          format: date-time
          description: Change timestamp
          example: "2024-01-01T14:30:00.000Z"
      required:
        - field
        - changedBy
        - changedAt
    
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier
          example: "123e4567-e89b-12d3-a456-426614174001"
        name:
          type: string
          description: User display name
          example: "John Doe"
        email:
          type: string
          format: email
          description: User email address
          example: "john.doe@enterprise.com"
      required:
        - id
        - name
        - email
    
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Items per page
          example: 20
        total:
          type: integer
          description: Total number of items
          example: 150
        totalPages:
          type: integer
          description: Total number of pages
          example: 8
        hasNext:
          type: boolean
          description: Whether there is a next page
          example: true
        hasPrev:
          type: boolean
          description: Whether there is a previous page
          example: false
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev
    
    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - DONE
        - CANCELLED
      description: Task status enumeration
      example: "TODO"
    
    TaskPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      default: MEDIUM
      description: Task priority level
      example: "HIGH"
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "Request validation failed"
            details:
              type: string
              description: Detailed error description
              example: "One or more fields contain invalid data"
            timestamp:
              type: string
              format: date-time
              description: Error timestamp
              example: "2024-01-01T10:00:00.000Z"
            correlationId:
              type: string
              format: uuid
              description: Request correlation ID
              example: "123e4567-e89b-12d3-a456-426614174000"
            path:
              type: string
              description: Request path
              example: "/api/tasks"
          required:
            - code
            - message
            - timestamp
            - correlationId
            - path
      required:
        - error
    
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                validationErrors:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field name with validation error
                        example: "title"
                      message:
                        type: string
                        description: Validation error message
                        example: "Title is required and cannot be empty"
                      value:
                        description: Invalid value that caused the error
                        example: ""
                    required:
                      - field
                      - message
    
    ConflictErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                existingTaskId:
                  type: string
                  format: uuid
                  description: ID of existing conflicting task
                  example: "123e4567-e89b-12d3-a456-426614174003"
    
    RateLimitErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                retryAfter:
                  type: integer
                  description: Seconds to wait before retrying
                  example: 60
  
  responses:
    BadRequest:
      description: Bad Request - Invalid request data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validation_error:
              summary: Validation error example
              value:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Request validation failed"
                  details: "One or more fields contain invalid data"
                  timestamp: "2024-01-01T10:00:00.000Z"
                  correlationId: "123e4567-e89b-12d3-a456-426614174000"
                  path: "/api/tasks"
                  validationErrors:
                    - field: "title"
                      message: "Title is required and cannot be empty"
                      value: ""
                    - field: "dueDate"
                      message: "Due date cannot be in the past"
                      value: "2023-01-01T00:00:00.000Z"
    
    Unauthorized:
      description: Unauthorized - Authentication required
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        WWW-Authenticate:
          description: Authentication scheme
          schema:
            type: string
            example: "Bearer"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            auth_required:
              summary: Authentication required
              value:
                error:
                  code: "UNAUTHORIZED"
                  message: "Authentication required"
                  details: "Valid bearer token must be provided"
                  timestamp: "2024-01-01T10:00:00.000Z"
                  correlationId: "123e4567-e89b-12d3-a456-426614174000"
                  path: "/api/tasks"
    
    Forbidden:
      description: Forbidden - Insufficient permissions
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
