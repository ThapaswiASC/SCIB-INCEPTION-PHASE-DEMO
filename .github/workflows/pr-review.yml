name: PR Review Fix Trigger
on:
  pull_request_target:
    types:
      - closed
jobs:
  trigger-agent:
    if: github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: "${{ github.event.repository.name }}"
          BRANCH: "${{ github.event.pull_request.head.ref }}"
          BASE: "${{ github.event.pull_request.base.ref }}"
          PR: "${{ github.event.pull_request.number }}"
        run: |
          USER_INPUTS=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg base "$BASE" \
            --arg pr "$PR" \
            '{"{{repo_string_true}}": $repo, "{{branch_string_false}}": $branch, "{{base_string_true}}": $base, "{{pr_string_true}}": $pr, "{{trigger_string_true}}": "pr_closed_review"}')
          echo "## Trigger Summary" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$USER_INPUTS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -f -X POST https://ext.avateam.io/workflows/workflow-executions \
            -H "Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..DapeInP9aBFJrJMob1qJ9taPn3ej4e0sPbQFFW69v07peZyEx8ZmKXoY1_OpLfRQwcwsYfkEamPIAyeyzuW1Gz7W9mo5afRNldJHfLg8PzdULfrHyyYBL6W7avxQhCLGx2dnJEzTCTbTMgQA6SkUM1i605btmQQzTpuT-W2CYje-BHRgAFE9xgoRtv_NbDzB2yJ0cNCngP57cD05g7UrwtZeg8_Cj3PrLgl0GoKQYpsBzuVuA8-aJkRg1mVR8Ofgv_-nZfeVBgC0eqp7lQQa7MtDd357Bd0mGALOD7Zak2VuVDGnSNyyl_9Rygu1gMwyoKW3i_WTIyT4JAdWeeJVdQ" \
            -F "pipelineId=2090" \
            -F "user=priya.rao@ascendion.com" \
            -F "priority=1" \
            -F "userInputs=$USER_INPUTS"
