openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: Unified API specification for SCIB Inception Phase Demo microservice
servers:
  - url: https://api.example.com
    description: Production server
  - url: https://staging-api.example.com
    description: Staging server
paths:
  /api/v1/tasks/{taskId}/status:
    put:
      operationId: DEMO-222_UpdateTaskStatus_PUT
      summary: Update task status in Kanban board
      description: Updates the status of a task when dragged from one column to another in the Kanban board
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskStatusResponse'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}:
    get:
      operationId: DEMO-222_GetTaskDetails_GET
      summary: Get task details
      description: Retrieves detailed information about a specific task
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: string
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailsResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/columns/{columnId}/stats:
    get:
      operationId: DEMO-222_GetColumnStatistics_GET
      summary: Get column statistics
      description: Retrieves statistics for a specific column including task count
      tags:
        - Column Management
      parameters:
        - name: columnId
          in: path
          required: true
          description: Unique identifier of the column
          schema:
            type: string
      responses:
        '200':
          description: Column statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnStatsResponse'
        '404':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/columns/bulk-update:
    put:
      operationId: DEMO-222_BulkUpdateColumnCounts_PUT
      summary: Bulk update column counts
      description: Updates task counts for multiple columns atomically
      tags:
        - Column Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateColumnCountsRequest'
      responses:
        '200':
          description: Column counts updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateColumnCountsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks:
    post:
      operationId: DEMO-757_CreateTask_POST
      summary: Create a new task
      description: Creates a new task for the authenticated user
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks:
    get:
      operationId: DEMO-757_GetUserTasks_GET
      summary: Get user tasks
      description: Retrieves paginated list of tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: sort
          in: query
          required: false
          description: Sort field and direction (e.g., createdAt,desc)
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: User tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTaskResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks/count:
    get:
      operationId: DEMO-757_GetTaskCount_GET
      summary: Get user task count
      description: Retrieves the total number of tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCountResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}:
    put:
      operationId: DEMO-757_UpdateTask_PUT
      summary: Update task
      description: Updates an existing task
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: DEMO-757_DeleteTask_DELETE
      summary: Delete task
      description: Deletes an existing task
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/bulk:
    post:
      operationId: DEMO-757_BulkCreateTasks_POST
      summary: Bulk create tasks
      description: Creates multiple tasks in a single operation
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskCreateRequest'
              maxItems: 100
      responses:
        '201':
          description: Tasks created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResponse'
        '400':
          description: Validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    UpdateTaskStatusRequest:
      type: object
      required:
        - status
        - columnId
      properties:
        status:
          type: string
          enum:
            - TO_DO
            - IN_PROGRESS
            - DONE
          description: New status of the task
        columnId:
          type: string
          description: Target column identifier
          minLength: 1
    UpdateTaskStatusResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique identifier of the task
        status:
          type: string
          enum:
            - TO_DO
            - IN_PROGRESS
            - DONE
          description: Updated status of the task
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was updated
    TaskDetailsResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique identifier of the task
        title:
          type: string
          description: Title of the task
        status:
          type: string
          enum:
            - TO_DO
            - IN_PROGRESS
            - DONE
          description: Current status of the task
        columnId:
          type: string
          description: Current column identifier
    ColumnStatsResponse:
      type: object
      properties:
        columnId:
          type: string
          description: Unique identifier of the column
        taskCount:
          type: integer
          description: Number of tasks in the column
          minimum: 0
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp of last update
    BulkUpdateColumnCountsRequest:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            type: object
            required:
              - columnId
              - increment
            properties:
              columnId:
                type: string
                description: Column identifier
              increment:
                type: integer
                description: Value to increment/decrement task count
    BulkUpdateColumnCountsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        updatedColumns:
          type: array
          items:
            type: string
          description: List of updated column identifiers
    TaskCreateRequest:
      type: object
      required:
        - title
        - userId
        - priority
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Title of the task
        description:
          type: string
          maxLength: 2000
          description: Detailed description of the task
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User ID who owns the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Priority level of the task
        dueDate:
          type: string
          format: date-time
          description: Due date for the task
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Title of the task
        description:
          type: string
          maxLength: 2000
          description: Detailed description of the task
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Status of the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Priority level of the task
        dueDate:
          type: string
          format: date-time
          description: Due date for the task
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the task
        title:
          type: string
          description: Title of the task
        description:
          type: string
          description: Detailed description of the task
        userId:
          type: integer
          format: int64
          description: User ID who owns the task
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Current status of the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Priority level of the task
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
        version:
          type: integer
          format: int64
          description: Version number for optimistic locking
    PagedTaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        page:
          type: integer
          description: Current page number
        size:
          type: integer
          description: Number of items per page
        totalElements:
          type: integer
          format: int64
          description: Total number of tasks
        totalPages:
          type: integer
          description: Total number of pages
        last:
          type: boolean
          description: Whether this is the last page
    TaskCountResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User identifier
        taskCount:
          type: integer
          format: int64
          description: Total number of tasks for the user
          maximum: 10000
    BulkTaskResponse:
      type: object
      properties:
        successCount:
          type: integer
          description: Number of successfully created tasks
        failureCount:
          type: integer
          description: Number of failed task creations
        createdTasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index of the failed task in the request
              message:
                type: string
                description: Error message
    ErrorResponse:
      type: object
      required:
        - timestamp
        - errorCode
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
        traceId:
          type: string
          description: Unique trace identifier for debugging
        errorCode:
          type: string
          description: Error code identifier
          enum:
            - TASK_NOT_FOUND
            - INVALID_STATUS_TRANSITION
            - COLUMN_NOT_FOUND
            - VALIDATION_ERROR
            - DATA_CONFLICT
            - TASK_LIMIT_EXCEEDED
            - CONCURRENT_CREATION_ERROR
            - PERFORMANCE_THRESHOLD_EXCEEDED
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: string
          description: Additional error details
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token-based authentication
security:
  - bearerAuth: []