openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: Unified API specification for SCIB Inception Phase Demo microservice
servers:
  - url: https://example.com
    description: Production server
paths:
  /api/v1/tasks/{taskId}/status:
    put:
      operationId: DEMO-222_UpdateTaskStatus_PUT
      summary: Update Task Status
      description: Updates the status of a task when dragged from one column to another in the Kanban board
      tags:
        - Kanban Board
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskStatusResponse'
        '400':
          description: Bad request - Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{taskId}:
    get:
      operationId: DEMO-222_GetTaskDetails_GET
      summary: Get Task Details
      description: Retrieves detailed information about a specific task
      tags:
        - Kanban Board
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailsResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/columns/{columnId}/stats:
    get:
      operationId: DEMO-222_GetColumnStatistics_GET
      summary: Get Column Statistics
      description: Retrieves statistics for a specific column including task count
      tags:
        - Kanban Board
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the column
      responses:
        '200':
          description: Column statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnStatsResponse'
        '404':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/columns/bulk-update:
    put:
      operationId: DEMO-222_BulkUpdateColumnCounts_PUT
      summary: Bulk Update Column Counts
      description: Updates task counts for multiple columns atomically
      tags:
        - Kanban Board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateColumnCountsRequest'
      responses:
        '200':
          description: Column counts updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateColumnCountsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks:
    post:
      operationId: DEMO-757_CreateTask_POST
      summary: Create Task
      description: Creates a new task in the system
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad request - Validation failed or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: DEMO-759_ListTasks_GET
      summary: List Tasks
      description: Retrieves a list of all tasks
      tags:
        - Task Management
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
  /api/v1/users/{userId}/tasks:
    get:
      operationId: DEMO-757_GetUserTasks_GET
      summary: Get User Tasks
      description: Retrieves paginated tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the user
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Page number
        - name: size
          in: query
          schema:
            type: integer
            default: 50
          description: Page size
      responses:
        '200':
          description: User tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTaskResponse'
  /api/v1/users/{userId}/tasks/count:
    get:
      operationId: DEMO-757_GetTaskCount_GET
      summary: Get Task Count
      description: Retrieves the total count of tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the user
      responses:
        '200':
          description: Task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCountResponse'
  /api/v1/tasks/{id}:
    get:
      operationId: DEMO-759_GetTask_GET
      summary: Get Task
      description: Retrieves a specific task by ID
      tags:
        - Task Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: DEMO-757_UpdateTask_PUT
      summary: Update Task
      description: Updates an existing task
      tags:
        - Task Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad request - Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: DEMO-757_DeleteTask_DELETE
      summary: Delete Task
      description: Deletes a specific task
      tags:
        - Task Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/bulk:
    post:
      operationId: DEMO-757_BulkCreateTasks_POST
      summary: Bulk Create Tasks
      description: Creates multiple tasks in a single operation
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Tasks created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResponse'
        '400':
          description: Bad request - Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UpdateTaskStatusRequest:
      type: object
      required:
        - status
        - columnId
      properties:
        status:
          type: string
          enum:
            - TO_DO
            - IN_PROGRESS
            - DONE
          description: New status of the task
        columnId:
          type: string
          description: Target column identifier
    UpdateTaskStatusResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique identifier of the task
        status:
          type: string
          description: Updated status of the task
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the update
    TaskDetailsResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique identifier of the task
        title:
          type: string
          description: Title of the task
        status:
          type: string
          enum:
            - TO_DO
            - IN_PROGRESS
            - DONE
          description: Current status of the task
        columnId:
          type: string
          description: Current column identifier
    ColumnStatsResponse:
      type: object
      properties:
        columnId:
          type: string
          description: Unique identifier of the column
        taskCount:
          type: integer
          description: Number of tasks in the column
        lastUpdated:
          type: string
          format: date-time
          description: Last update timestamp
    BulkUpdateColumnCountsRequest:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
                description: Column identifier
              increment:
                type: integer
                description: Increment value (positive or negative)
    BulkUpdateColumnCountsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        updatedColumns:
          type: array
          items:
            type: string
          description: List of updated column identifiers
    TaskCreateRequest:
      type: object
      required:
        - title
        - userId
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Title of the task
        description:
          type: string
          maxLength: 10000
          description: Detailed description of the task
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User identifier who owns the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Priority level of the task
        dueDate:
          type: string
          format: date-time
          description: Due date for the task
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Updated title of the task
        description:
          type: string
          maxLength: 10000
          description: Updated description of the task
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Updated status of the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Updated priority level
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the task
        title:
          type: string
          description: Title of the task
        description:
          type: string
          description: Description of the task
        userId:
          type: integer
          format: int64
          description: User identifier who owns the task
        status:
          type: string
          description: Current status of the task
        priority:
          type: string
          description: Priority level of the task
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    PagedTaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        totalElements:
          type: integer
          format: int64
          description: Total number of tasks
        totalPages:
          type: integer
          description: Total number of pages
        currentPage:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
    TaskCountResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User identifier
        taskCount:
          type: integer
          format: int64
          description: Total number of tasks for the user
    BulkTaskResponse:
      type: object
      properties:
        successCount:
          type: integer
          description: Number of successfully created tasks
        failureCount:
          type: integer
          description: Number of failed task creations
        createdTasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index of the failed task in the request
              message:
                type: string
                description: Error message
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        traceId:
          type: string
          description: Trace identifier for debugging
        errorCode:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: array
          items:
            type: string
          description: Additional error details
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []