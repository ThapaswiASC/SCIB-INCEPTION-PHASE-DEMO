openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: High-performance task management system API supporting creation of at least 10,000 tasks per user
servers:
  - url: https://example.com
    description: Production server
paths:
  /api/v1/tasks:
    post:
      operationId: DEMO757CreateTaskPOST
      summary: Create Task
      description: Creates a new task for a user with performance monitoring and task limit validation
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Bad request - validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - concurrent creation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable - performance threshold exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/bulk:
    post:
      operationId: DEMO757BulkCreateTasksPOST
      summary: Bulk Create Tasks
      description: Creates multiple tasks in a single operation
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Tasks created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResponse'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userId}/tasks:
    get:
      operationId: DEMO757GetUserTasksGET
      summary: Get User Tasks
      description: Retrieves all tasks for a specific user with pagination support
      tags:
        - Tasks
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userId}/tasks/count:
    get:
      operationId: DEMO757GetTaskCountGET
      summary: Get Task Count
      description: Retrieves the total number of tasks for a specific user
      tags:
        - Tasks
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCountResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{taskId}:
    get:
      operationId: DEMO757GetTaskByIdGET
      summary: Get Task by ID
      description: Retrieves a specific task by its ID
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: DEMO757UpdateTaskPUT
      summary: Update Task
      description: Updates an existing task with optimistic locking support
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - optimistic locking failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: DEMO757DeleteTaskDELETE
      summary: Delete Task
      description: Deletes a specific task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    TaskCreateRequest:
      type: object
      required:
        - userId
        - title
      properties:
        userId:
          type: integer
          format: int64
          description: User ID
          minimum: 1
        title:
          type: string
          description: Task title
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Task description
          maxLength: 1000
        status:
          type: string
          description: Task status
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          default: PENDING
        priority:
          type: string
          description: Task priority
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          description: Task title
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Task description
          maxLength: 1000
        status:
          type: string
          description: Task status
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        priority:
          type: string
          description: Task priority
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
        version:
          type: integer
          format: int64
          description: Version for optimistic locking
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Task ID
        userId:
          type: integer
          format: int64
          description: User ID
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        status:
          type: string
          description: Task status
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        priority:
          type: string
          description: Task priority
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Task last update timestamp
        version:
          type: integer
          format: int64
          description: Version for optimistic locking
    TaskCountResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User ID
        taskCount:
          type: integer
          format: int64
          description: Total number of tasks
        maxTasksAllowed:
          type: integer
          format: int32
          description: Maximum tasks allowed per user
          default: 10000
    BulkTaskResponse:
      type: object
      properties:
        successCount:
          type: integer
          description: Number of tasks created successfully
        failureCount:
          type: integer
          description: Number of tasks that failed to create
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Error code
          enum:
            - TASK_LIMIT_EXCEEDED
            - CONCURRENT_CREATION_ERROR
            - PERFORMANCE_THRESHOLD_EXCEEDED
            - VALIDATION_ERROR
            - OPTIMISTIC_LOCK_ERROR
            - DATA_INTEGRITY_ERROR
        message:
          type: string
          description: Error message
        timestamp:
          type: integer
          format: int64
          description: Error timestamp
        details:
          type: array
          items:
            type: string
          description: Additional error details
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
