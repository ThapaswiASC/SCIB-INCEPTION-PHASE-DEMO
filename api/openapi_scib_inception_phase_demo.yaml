openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: Unified API specification for SCIB Inception Phase Demo microservice
servers:
  - url: https://example.com
    description: Production server
paths:
  /api/v1/tasks/{taskId}/status:
    put:
      operationId: DEMO-222_UpdateTaskStatus_PUT
      summary: Update Task Status
      description: Updates the status of a task in the Kanban board system
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdateRequest'
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusUpdateResponse'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}:
    get:
      operationId: DEMO-222_GetTaskDetails_GET
      summary: Get Task Details
      description: Retrieves detailed information about a specific task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailsResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    put:
      operationId: DEMO-757_UpdateTask_PUT
      summary: Update Task
      description: Updates an existing task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: DEMO-757_DeleteTask_DELETE
      summary: Delete Task
      description: Deletes a task from the system
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/columns/{columnId}/count:
    get:
      operationId: DEMO-222_GetColumnTasksCount_GET
      summary: Get Column Tasks Count
      description: Retrieves the count of tasks in a specific column
      tags:
        - Columns
      parameters:
        - name: columnId
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
          description: Unique identifier of the column
      responses:
        '200':
          description: Column task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnTaskCountResponse'
        '404':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks:
    get:
      operationId: DEMO-222_GetAllTasksByStatus_GET
      summary: Get All Tasks by Status
      description: Retrieves all tasks filtered by status
      tags:
        - Tasks
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum:
              - TODO
              - IN_PROGRESS
              - DONE
          description: Task status filter
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSummary'
        '400':
          description: Invalid status parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    post:
      operationId: DEMO-757_CreateTask_POST
      summary: Create Task
      description: Creates a new task in the system
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}/validate-move:
    post:
      operationId: DEMO-222_ValidateTaskMove_POST
      summary: Validate Task Move
      description: Validates if a task can be moved from one status to another
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTaskMoveRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTaskMoveResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks:
    get:
      operationId: DEMO-757_GetUserTasks_GET
      summary: Get User Tasks
      description: Retrieves all tasks for a specific user with pagination
      tags:
        - Tasks
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the user
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Page size
      responses:
        '200':
          description: User tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTaskResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks/count:
    get:
      operationId: DEMO-757_GetTaskCount_GET
      summary: Get Task Count
      description: Retrieves the total count of tasks for a specific user
      tags:
        - Tasks
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Unique identifier of the user
      responses:
        '200':
          description: Task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCountResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/bulk:
    post:
      operationId: DEMO-757_BulkCreateTasks_POST
      summary: Bulk Create Tasks
      description: Creates multiple tasks in a single operation
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskCreateRequest'
              maxItems: 100
      responses:
        '201':
          description: Tasks created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResponse'
        '400':
          description: Validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    TaskStatusUpdateRequest:
      type: object
      required:
        - status
        - columnId
      properties:
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: New status for the task
        columnId:
          type: string
          maxLength: 50
          description: Target column identifier
    TaskStatusUpdateResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          description: Unique identifier of the task
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: Updated task status
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the update
        message:
          type: string
          description: Success message
    TaskDetailsResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          description: Unique identifier of the task
        title:
          type: string
          maxLength: 255
          description: Task title
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: Current task status
        assignee:
          type: string
          format: email
          description: Email of the assigned user
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
    ColumnTaskCountResponse:
      type: object
      properties:
        columnId:
          type: string
          description: Column identifier
        taskCount:
          type: integer
          description: Number of tasks in the column
    TaskSummary:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          description: Unique identifier of the task
        title:
          type: string
          maxLength: 255
          description: Task title
        status:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: Current task status
    ValidateTaskMoveRequest:
      type: object
      required:
        - fromStatus
        - toStatus
      properties:
        fromStatus:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: Current task status
        toStatus:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
            - DONE
          description: Target task status
    ValidateTaskMoveResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the move is valid
        message:
          type: string
          description: Validation message
    TaskCreateRequest:
      type: object
      required:
        - title
        - userId
        - priority
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 2000
          description: Task description
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User ID who owns the task
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Task priority level
        dueDate:
          type: string
          format: date-time
          description: Task due date
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 2000
          description: Task description
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Task status
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - URGENT
          description: Task priority level
        dueDate:
          type: string
          format: date-time
          description: Task due date
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the task
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        userId:
          type: integer
          format: int64
          description: User ID who owns the task
        status:
          type: string
          description: Current task status
        priority:
          type: string
          description: Task priority level
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Task last update timestamp
    PagedTaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
          description: List of tasks
        page:
          type: integer
          description: Current page number
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          format: int64
          description: Total number of tasks
        totalPages:
          type: integer
          description: Total number of pages
    TaskCountResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User identifier
        taskCount:
          type: integer
          format: int64
          description: Total number of tasks for the user
    BulkTaskResponse:
      type: object
      properties:
        successCount:
          type: integer
          description: Number of successfully created tasks
        failureCount:
          type: integer
          description: Number of failed task creations
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
          description: List of created tasks
        errors:
          type: array
          items:
            type: string
          description: List of error messages for failed creations
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        traceId:
          type: string
          description: Trace identifier for debugging
        errorCode:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: array
          items:
            type: string
          description: Additional error details
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token-based authentication
security:
  - bearerAuth: []