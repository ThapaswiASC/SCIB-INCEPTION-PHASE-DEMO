openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: Unified API specification for SCIB Inception Phase Demo microservice
servers:
  - url: https://api.example.com
    description: Production server
  - url: https://staging-api.example.com
    description: Staging server
paths:
  /api/v1/tasks/{taskId}/status:
    put:
      operationId: DEMO222UpdateTaskStatusPUT
      summary: Update task status in Kanban board
      description: Updates the status of a task when dragged from one column to another
      tags:
        - Kanban Board
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdateRequest'
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusUpdateResponse'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}:
    get:
      operationId: DEMO222GetTaskDetailsGET
      summary: Get task details
      description: Retrieves detailed information about a specific task
      tags:
        - Kanban Board
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: string
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailsResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/columns/{columnId}/stats:
    get:
      operationId: DEMO222GetColumnStatisticsGET
      summary: Get column statistics
      description: Retrieves statistics for a specific Kanban board column
      tags:
        - Kanban Board
      parameters:
        - name: columnId
          in: path
          required: true
          description: Unique identifier of the column
          schema:
            type: string
      responses:
        '200':
          description: Column statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnStatsResponse'
        '404':
          description: Column not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/columns/bulk-update:
    put:
      operationId: DEMO222BulkUpdateColumnCountsPUT
      summary: Bulk update column counts
      description: Updates task counts for multiple columns atomically
      tags:
        - Kanban Board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkColumnUpdateRequest'
      responses:
        '200':
          description: Column counts updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkColumnUpdateResponse'
        '400':
          description: Invalid update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks:
    post:
      operationId: DEMO757CreateTaskPOST
      summary: Create a new task
      description: Creates a new task in the task management system
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error or task limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks:
    get:
      operationId: DEMO757GetUserTasksGET
      summary: Get user tasks
      description: Retrieves paginated list of tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: User tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTaskResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{userId}/tasks/count:
    get:
      operationId: DEMO757GetTaskCountGET
      summary: Get task count for user
      description: Retrieves the total number of tasks for a specific user
      tags:
        - Task Management
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCountResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}/update:
    put:
      operationId: DEMO757UpdateTaskPUT
      summary: Update an existing task
      description: Updates task details for a specific task
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/{taskId}/delete:
    delete:
      operationId: DEMO757DeleteTaskDELETE
      summary: Delete a task
      description: Deletes a specific task from the system
      tags:
        - Task Management
      parameters:
        - name: taskId
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/bulk:
    post:
      operationId: DEMO757BulkCreateTasksPOST
      summary: Bulk create tasks
      description: Creates multiple tasks in a single operation
      tags:
        - Task Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Tasks created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/tasks/validate:
    post:
      operationId: DEMO759ValidateInputPOST
      summary: Validate task input
      description: Validates task input data without creating a task
      tags:
        - Validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskValidationRequest'
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    TaskStatusUpdateRequest:
      type: object
      required:
        - status
        - columnId
      properties:
        status:
          type: string
          enum: [TO_DO, IN_PROGRESS, DONE]
          description: New status of the task
        columnId:
          type: string
          description: Target column identifier
    TaskStatusUpdateResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique identifier of the task
        status:
          type: string
          description: Updated status
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the update
    TaskDetailsResponse:
      type: object
      properties:
        taskId:
          type: string
        title:
          type: string
        status:
          type: string
        columnId:
          type: string
    ColumnStatsResponse:
      type: object
      properties:
        columnId:
          type: string
        taskCount:
          type: integer
        lastUpdated:
          type: string
          format: date-time
    BulkColumnUpdateRequest:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            type: object
            properties:
              columnId:
                type: string
              increment:
                type: integer
    BulkColumnUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        updatedColumns:
          type: array
          items:
            type: string
    TaskCreateRequest:
      type: object
      required:
        - title
        - userId
        - priority
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 2000
          description: Task description
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User identifier
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          description: Task priority level
        dueDate:
          type: string
          format: date-time
          description: Task due date
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        userId:
          type: integer
          format: int64
        status:
          type: string
        priority:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PagedTaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
    TaskCountResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        taskCount:
          type: integer
          format: int64
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED]
        dueDate:
          type: string
          format: date-time
    BulkTaskResponse:
      type: object
      properties:
        successCount:
          type: integer
        failureCount:
          type: integer
        createdTasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: string
    TaskValidationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        priority:
          type: string
          pattern: ^(HIGH|MEDIUM|LOW)$
        dueDate:
          type: string
          format: date-time
    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
    ValidationErrorResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token-based authentication
security:
  - bearerAuth: []