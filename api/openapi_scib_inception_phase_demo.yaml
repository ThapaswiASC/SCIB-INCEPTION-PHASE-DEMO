openapi: 3.0.3
info:
  title: scib_inception_phase_demo API
  version: 1.0.0
  description: API specification for task management system with comprehensive error handling
servers:
  - url: https://example.com
    description: Production server
paths:
  /api/tasks:
    post:
      operationId: DEMO-760CreateTaskPOST
      summary: Create a new task
      description: Creates a new task with comprehensive error handling for database and timeout issues
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/tasks/{id}:
    get:
      operationId: DEMO-760GetTaskGET
      summary: Get task by ID
      description: Retrieves a specific task by its ID
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    put:
      operationId: DEMO-760UpdateTaskPUT
      summary: Update task
      description: Updates an existing task
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      operationId: DEMO-760DeleteTaskDELETE
      summary: Delete task
      description: Deletes a task by ID
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    TaskCreateRequest:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Task title
          example: Complete project documentation
        description:
          type: string
          maxLength: 500
          description: Task description
          example: Write comprehensive documentation for the new feature
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          description: Task priority level
          example: HIGH
        dueDate:
          type: string
          format: date-time
          description: Task due date (must be in the future)
          example: '2024-12-31T23:59:59Z'
    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Task title
          example: Updated task title
        description:
          type: string
          maxLength: 500
          description: Task description
          example: Updated task description
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          description: Task priority level
          example: MEDIUM
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Task status
          example: IN_PROGRESS
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: '2024-12-31T23:59:59Z'
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Task ID
          example: 1
        title:
          type: string
          description: Task title
          example: Complete project documentation
        description:
          type: string
          description: Task description
          example: Write comprehensive documentation for the new feature
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
          description: Task priority level
          example: HIGH
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Task status
          example: PENDING
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Task last update timestamp
          example: '2024-01-15T10:30:00Z'
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: '2024-12-31T23:59:59Z'
        userId:
          type: integer
          format: int64
          description: ID of the user who created the task
          example: 123
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Error code
          enum:
            - SERVICE_UNAVAILABLE
            - REQUEST_TIMEOUT
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - INTERNAL_SERVER_ERROR
          example: SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable error message
          example: Service temporarily unavailable, please try again later
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: '2024-01-15T10:30:00Z'
        preservedInput:
          type: object
          description: Original user input preserved for retry
          additionalProperties: true
        details:
          type: array
          description: Additional error details
          items:
            type: string
          example:
            - Database connection failed
            - Retry after 30 seconds
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
          example: Operation completed successfully
        timestamp:
          type: string
          format: date-time
          description: Response timestamp
          example: '2024-01-15T10:30:00Z'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-based authentication with 24-hour token expiry
  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: User does not have permission to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TimeoutError:
      description: Request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    TaskIdParam:
      name: id
      in: path
      required: true
      description: Unique identifier of the task
      schema:
        type: integer
        format: int64
        minimum: 1
tags:
  - name: Tasks
    description: Task management operations with comprehensive error handling